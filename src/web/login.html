<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环形的心 · 登录</title>
<style>
  :root {
    --text:  #eef2f8;
    --dim:   rgba(238,242,248,.58);
    --faint: rgba(238,242,248,.34);
    --accent: #7fb0ff;
    --danger: #ff8b8b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 14px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    background: #060a12;
    overflow: hidden;
  }

  /* ── 背景：素色渐变，色相差很小 ────────────── */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -3;
    background:
      radial-gradient(ellipse 78% 58% at 16% 8%,  rgba(104,126,176,.075), transparent 64%),
      radial-gradient(ellipse 72% 56% at 84% 12%, rgba(126,110,170,.065), transparent 66%),
      radial-gradient(ellipse 96% 72% at 50% 104%, rgba(58,80,126,.095), transparent 72%),
      linear-gradient(168deg, #0a0d15 0%, #0b0f18 38%, #090c13 72%, #0a0d14 100%);
  }

  .bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 62% 50% at 50% 34%, rgba(150,172,214,.045), transparent 72%);
    animation: breathe 26s ease-in-out infinite alternate;
  }

  @keyframes breathe {
    from { opacity: .65; }
    to   { opacity: 1; }
  }

  /* ── 同心圆环：一圈套一圈，慢慢呼吸 ─────── */
  .rings {
    position: fixed;
    inset: 0;
    /* 在压暗层(.veil)之上，才不被打薄 */
    z-index: -1;
    pointer-events: none;
    display: grid;
    place-items: center;
  }

  .rings i {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(127,176,255,.18);
    animation: ringPulse 13s ease-in-out infinite;
  }

  .rings i:nth-child(1) { width: 66vmin;  height: 66vmin;  animation-delay: 0s; }
  .rings i:nth-child(2) { width: 80vmin;  height: 80vmin;  animation-delay: -3.2s; }
  .rings i:nth-child(3) { width: 94vmin;  height: 94vmin;  animation-delay: -6.5s; }
  .rings i:nth-child(4) { width: 108vmin; height: 108vmin; animation-delay: -9.8s; }

  @keyframes ringPulse {
    0%, 100% { opacity: .55; transform: scale(1); }
    50%      { opacity: .95; transform: scale(1.035); }
  }

  /* ── 环上文字：热评正常横排，锚在四道圈的圆周上，
       从上到下（或从下到上）做微曲线竖向漂移，首尾渐显渐隐 ── */
  .ring-words {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }
  .ring-words .rw {
    position: absolute;
    white-space: nowrap;
    letter-spacing: 2px;
    font-size: 13px;
    color: rgba(168,198,246,.55);
    opacity: 0;
    will-change: transform, opacity;
    animation: rwDrift linear infinite;
  }
  .ring-words .rw.warm { color: rgba(255,212,121,.55); }

  /* 微曲线 = 竖向直漂（外层） + 横向小幅摆动（内层 span），叠出来是一条缓 S 弯 */
  .ring-words .rw .sway {
    display: inline-block;
    animation: rwSway ease-in-out infinite alternate;
  }

  /* 深度：焦在圆心 —— 内圈亮而实，外圈暗而微虚 */
  .ring-words .rw[data-depth="0"] { color: rgba(255,212,121,.68); filter: blur(0); }
  .ring-words .rw[data-depth="1"] { color: rgba(168,198,246,.5);  filter: blur(.3px); }
  .ring-words .rw[data-depth="2"] { color: rgba(168,198,246,.42); filter: blur(.5px); }
  .ring-words .rw[data-depth="3"] { color: rgba(168,198,246,.36); filter: blur(.7px); }

  /* 首尾各 20% 渐隐，行程写在 --from/--to（从上到下 或 从下到上） */
  @keyframes rwDrift {
    0%   { transform: translate(-50%, calc(-50% + var(--from, -150px))); opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translate(-50%, calc(-50% + var(--to, 150px))); opacity: 0; }
  }

  @keyframes rwSway {
    from { transform: translateX(calc(-1 * var(--sway, 14px))); }
    to   { transform: translateX(var(--sway, 14px)); }
  }

  /* 系统开了「减少动态」：停掉漂移和呼吸圈，静态展示，句子照读 */
  @media (prefers-reduced-motion: reduce) {
    .ring-words .rw,
    .ring-words .rw .sway,
    .rings i { animation: none; }
    .ring-words .rw { opacity: 1; transform: translate(-50%, -50%); }
  }

  /* ── 压暗：中间留亮，四周压暗 ────────────── */
  .veil {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 66% 74% at 50% 44%, rgba(6,10,18,.10) 0%, rgba(6,10,18,.40) 60%, rgba(6,10,18,.66) 100%);
  }

  /* ── 登录卡片 ───────────────────────────── */
  .card {
    position: relative;
    width: min(372px, 100%);
    padding: 32px 30px 26px;
    border-radius: 22px;
    background: rgba(11,17,29,.74);
    backdrop-filter: blur(30px) saturate(155%);
    -webkit-backdrop-filter: blur(30px) saturate(155%);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow:
      0 30px 90px rgba(0,0,0,.62),
      inset 0 1px 0 rgba(255,255,255,.07);
    animation: rise .55s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }

  /* 卡片顶部的一道柔光 */
  .card::before {
    content: "";
    position: absolute;
    top: -1px; left: 18%; right: 18%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(127,176,255,.75), transparent);
  }

  /* ── 标志 ───────────────────────────────── */
  .logo {
    width: 54px;
    height: 54px;
    margin: 0 auto 15px;
    animation: spin 40s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .logo svg { width: 100%; height: 100%; display: block; }

  /* ── 文案 ───────────────────────────────── */
  .ver {
    font-size: 11.5px;
    font-weight: 400;
    color: var(--faint);
    letter-spacing: .6px;
    margin-left: 7px;
    vertical-align: 3px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-align: center;
    margin-bottom: 5px;
  }

  .sub {
    text-align: center;
    color: var(--dim);
    font-size: 12px;
    margin-bottom: 26px;
    letter-spacing: .3px;
  }

  /* ── 表单 ───────────────────────────────── */
  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 7px;
    letter-spacing: .4px;
  }

  .input-wrap { position: relative; }

  input {
    width: 100%;
    height: 47px;
    padding: 0 46px 0 15px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    letter-spacing: .5px;
    outline: none;
    transition: border-color .18s, background .18s, box-shadow .18s;
  }

  input::placeholder { color: var(--faint); letter-spacing: 0; }

  input:focus {
    border-color: rgba(127,176,255,.62);
    background: rgba(127,176,255,.06);
    box-shadow: 0 0 0 4px rgba(127,176,255,.10);
  }

  input:disabled { opacity: .5; cursor: not-allowed; }

  /* 显示/隐藏令牌 */
  .eye {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border: none;
    background: transparent;
    color: var(--faint);
    font-size: 15px;
    cursor: pointer;
    border-radius: 9px;
    transition: color .15s, background .15s;
  }

  .eye:hover { color: var(--dim); background: rgba(255,255,255,.05); }

  /* ── 登录按钮 ───────────────────────────── */
  .btn {
    width: 100%;
    height: 46px;
    margin-top: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(180deg, #83b4ff 0%, #5a92e6 100%);
    color: #06101f;
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    letter-spacing: .8px;
    cursor: pointer;
    box-shadow: 0 8px 26px rgba(90,146,230,.32);
    transition: transform .12s, box-shadow .18s, filter .18s;
  }

  .btn:hover { filter: brightness(1.07); box-shadow: 0 10px 32px rgba(90,146,230,.42); }
  .btn:active { transform: scale(.985); }
  .btn:disabled { filter: grayscale(.4) brightness(.8); cursor: not-allowed; }

  .arrow { transition: transform .18s ease; }
  .btn:hover .arrow { transform: translateX(3px); }

  /* ── 错误提示 ───────────────────────────── */
  .err {
    display: none;
    align-items: center;
    gap: 7px;
    margin-top: 12px;
    padding: 10px 13px;
    border-radius: 9px;
    background: rgba(255,139,139,.09);
    border: 1px solid rgba(255,139,139,.26);
    color: var(--danger);
    font-size: 12.5px;
    animation: shake .4s;
  }

  .err.show { display: flex; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    22% { transform: translateX(-6px); }
    44% { transform: translateX(6px); }
    66% { transform: translateX(-3px); }
    88% { transform: translateX(3px); }
  }

  /* ── 底部提示 ───────────────────────────── */
  .foot {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.07);
    font-size: 11.5px;
    color: var(--faint);
    line-height: 1.8;
    text-align: center;
  }

  .foot code {
    padding: 1px 6px;
    border-radius: 5px;
    background: rgba(255,255,255,.06);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 11px;
    color: var(--dim);
  }

  @media (max-width: 480px) {
    .card { padding: 32px 24px 24px; border-radius: 18px; }
    h1 { font-size: 20px; }
    .logo { width: 52px; height: 52px; margin-bottom: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="veil"></div>

<!-- 同心圆环：呼应"环形的心"（在压暗层之上，才看得见） -->
<div class="rings" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<!-- 环上文字：热评正常横排，锚在四道圈的圆周上，上下浮动，渐显渐隐 -->
<div class="ring-words" id="ring-words" aria-hidden="true"></div>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="46" stroke="rgba(127,176,255,.18)" stroke-width="1"/>
      <circle cx="50" cy="50" r="37" fill="#2f5488" opacity=".55"/>
      <circle cx="50" cy="50" r="29" fill="#4a7fd4" opacity=".70"/>
      <circle cx="50" cy="50" r="21" fill="#6fa8ff" opacity=".82"/>
      <circle cx="50" cy="50" r="13" fill="#b98cff" opacity=".90"/>
      <circle cx="50" cy="50" r="6"  fill="#ffd479"/>
      <circle cx="50" cy="50" r="46" stroke="url(#g)" stroke-width="1.5" opacity=".8"/>
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7fb0ff" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#b98cff" stop-opacity=".1"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <h1>环形的心<span class="ver">v1.0.1</span></h1>
  <p class="sub">一个会遗忘的记忆库 · 令牌登录</p>

  <form id="form" autocomplete="off">
    <div class="field">
      <label for="token">访问令牌</label>
      <div class="input-wrap">
        <input id="token" type="password"
               autocomplete="current-password" spellcheck="false" autofocus>
        <button type="button" class="eye" id="eye" aria-label="显示令牌">◉</button>
      </div>
    </div>

    <div class="err" id="err"><span>✕</span><span id="errText">令牌不对</span></div>

    <button type="submit" class="btn" id="submit">
      进入面板<span class="arrow">→</span>
    </button>
  </form>
</div>

<script>
  // ── 环上文字：对大肥鱼的热评，正常横排，锚在四道圈的圆周上，上下浮动 ──
  // 内容默认读同目录的 hot-comments.json（换成真实热评，只改那一个文件）。
  // 文件读不到、或者 list 是空的，退回库里「她看得见的圈」的真实记忆；
  // 再不行才用下面这组内置兜底。
  const FALLBACK_COMMENTS = [
    '我是 DeepSeek，你也可以叫我大肥鱼',
    '服务器繁忙，请稍后再试',
    '那天很开心，但忘了是谁',
    '第一次叫我名字那天'
  ];

  (async () => {
    const host = document.getElementById('ring-words');
    if (!host) return;

    // 1) 抖音热评（默认）
    let pool = null;
    try {
      const r = await fetch('hot-comments.json', { credentials: 'omit' });
      if (r.ok) {
        const j = await r.json();
        const got = (Array.isArray(j.list) ? j.list : [])
          .map((c) => (typeof c === 'string' ? c : (c && c.text)))
          .filter(Boolean)
          .map((t) => String(t).replace(/\s+/g, ' ').trim().slice(0, 34));
        if (got.length) pool = got;
      }
    } catch {
      // 文件不在 / 坏了，走下一级
    }

    // 2) 热评文件坏了：退回库里的真实记忆碎片
    if (!pool) {
      try {
        const r = await fetch('/api/login-backdrop?n=14', { credentials: 'omit' });
        if (r.ok) {
          const j = await r.json();
          const got = (j && j.data && j.data.items) || [];
          if (Array.isArray(got) && got.length) pool = got.map((t) => String(t));
        }
      } catch {
        // 接口挂了不该让背景空着
      }
    }

    // 3) 都不行：内置兜底
    if (!pool) pool = FALLBACK_COMMENTS.slice();

    // 洗牌轮转：换句不重样，一轮转完重新洗
    let bag = pool.slice().sort(() => Math.random() - 0.5);
    let cursor = 0;
    const nextText = () => {
      if (cursor >= bag.length) {
        bag = pool.slice().sort(() => Math.random() - 0.5);
        cursor = 0;
      }
      return bag[cursor++];
    };

    // 四道圈的半径（vmin）—— 跟 .rings 里那四道呼吸圈逐一对齐
    const RING_R = [33, 40, 47, 54];
    const RING_SIZE = [12.5, 13.5, 14.5, 15.5];

    // ── 数量与位置的两条硬规矩 ──────────────────────────
    // 1. 同时最多 MAX_ACTIVE 句在场上；一句漂完先退场歇 0.6~2.6 秒，
    //    场上数量在 3~5 之间自然呼吸，永远不会挤满
    // 2. 屏幕按 45° 分 8 个扇区，一个扇区同时只许一句 ——
    //    天然绕着卡均匀散开，谁也别想跟谁叠罗汉
    const MAX_ACTIVE = 5;
    const SECTORS = 8;                       // 45° 一个
    const PER_HALF_MAX = 3;                  // 上下半球各最多 3 句
    const SECTOR_WOBBLE = 0.42;              // 扇区内角度抖动 ±24°

    // 登录卡的实际位置（量不到就退回屏幕中心一块保守区）
    const cardZone = () => {
      const card = document.querySelector('.card');
      if (card) {
        const r = card.getBoundingClientRect();
        if (r.width > 0) return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, hw: r.width / 2, hh: r.height / 2 };
      }
      return { cx: window.innerWidth / 2, cy: window.innerHeight / 2, hw: 190, hh: 180 };
    };

    // 扇区占用表：null = 空着
    const sectorOwner = new Array(SECTORS).fill(null);
    const sectorAngle = (k) => k * ((Math.PI * 2) / SECTORS) + Math.PI / 8; // 22.5° 起步，避开正上正下
    const isTop = (a) => Math.sin(a) < 0;

    // 空扇区里挑一个：先按上下半球配额筛（各最多 3），再随机
    const freeSectors = () => sectorOwner.map((o, k) => (o ? -1 : k)).filter((k) => k >= 0);
    const claimSector = () => {
      const free = freeSectors();
      if (!free.length) return null;
      const topUsed = items.filter((it) => it.sector != null && isTop(sectorAngle(it.sector))).length;
      const bottomUsed = items.filter((it) => it.sector != null && !isTop(sectorAngle(it.sector))).length;
      const balanced = free.filter((k) => {
        const top = isTop(sectorAngle(k));
        return top ? topUsed < PER_HALF_MAX : bottomUsed < PER_HALF_MAX;
      });
      const pickFrom = balanced.length ? balanced : free;
      return pickFrom[Math.floor(Math.random() * pickFrom.length)];
    };

    // 在指定扇区+圈上挑一个具体落点：扇区内抖角度，圈不对就换圈试，
    // 卡和现役句子都避开；实在不行用最外圈兜底（最外圈永远在卡外）
    const pickSpot = (sector, textW) => {
      const base = sectorAngle(sector);
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      const zone = cardZone();
      const others = items
        .filter((o) => o.sector != null)
        .map((o) => {
          const r = o.el.getBoundingClientRect();
          return { x: r.x + r.width / 2, y: r.y + r.height / 2, w: r.width };
        });
      let best = null;
      for (const ring of [0, 1, 2, 3]) {
        const R = RING_R[ring] * (Math.min(window.innerWidth, window.innerHeight) / 100);
        for (let k = 0; k < 6; k++) {
          const a = base + (Math.random() - 0.5) * SECTOR_WOBBLE;
          let x = cx + Math.cos(a) * R;
          let y = cy + Math.sin(a) * R;
          x = Math.max(textW / 2 + 30, Math.min(window.innerWidth - textW / 2 - 30, x));
          y = Math.max(48, Math.min(window.innerHeight - 48, y));
          const hitCard =
            Math.abs(x - zone.cx) < zone.hw + 26 + textW / 2 &&
            Math.abs(y - zone.cy) < zone.hh + 26 + 20;
          const hitOther = others.some((o) =>
            Math.abs(o.x - x) < (o.w + textW) / 2 + 18 && Math.abs(o.y - y) < 60
          );
          if (!hitCard && !hitOther) return { x, y, ring, a };
          const dist = Math.abs(x - zone.cx) + Math.abs(y - zone.cy);
          if (!best || dist > best.dist) best = { x, y, ring, a, dist };
        }
      }
      return best; // 兜底：最外圈在卡外，dist 最大的通常就是它
    };

    // 场上的 5 个活位（元素常驻，位置与句子每趟换新）
    const items = [];
    for (let i = 0; i < MAX_ACTIVE; i++) {
      const el = document.createElement('span');
      el.className = 'rw';
      host.appendChild(el);
      items.push({ el, ring: 0, text: nextText(), sector: null, angle: null });
    }

    const place = (it, phrase) => {
      const size = RING_SIZE[it.ring];
      const w = phrase.length * (size + 2); // 中文全宽粗算
      const spot = pickSpot(it.sector, w);
      it.ring = spot.ring;
      it.el.dataset.depth = it.ring;        // 深度层：内圈亮而实，外圈暗而微虚
      it.el.style.fontSize = RING_SIZE[it.ring] + 'px';

      // 行程：从上到下 或 从下到上，单程 140~170px —— 从远处漂来、往远处去
      const down = Math.random() < 0.5;
      const half = 140 + Math.random() * 30;
      let y = spot.y;
      const yMin = 48 + half, yMax = window.innerHeight - 48 - half;
      y = yMin <= yMax ? Math.max(yMin, Math.min(yMax, y)) : window.innerHeight / 2;

      it.el.innerHTML = '<span class="sway"></span>';
      it.el.firstChild.textContent = phrase;
      it.el.style.left = spot.x + 'px';
      it.el.style.top = y + 'px';
      it.el.style.setProperty('--from', (down ? -half : half).toFixed(0) + 'px');
      it.el.style.setProperty('--to', (down ? half : -half).toFixed(0) + 'px');
      // 微曲线：竖向直漂叠一个横向小摆；三成句子近乎直行，节奏才不均质
      const swayAmp = Math.random() < 0.3 ? 3 + Math.random() * 3 : 8 + Math.random() * 12;
      it.el.style.setProperty('--sway', (swayAmp * (Math.random() < 0.5 ? -1 : 1)).toFixed(0) + 'px');
      // 时长拉宽到 13~30s：快慢差一倍多，视差才出得来
      const dur = 13 + Math.random() * 17;
      it.el.style.animationDuration = `${dur.toFixed(2)}s, ${(dur / 2).toFixed(2)}s`;
      return dur;
    };

    // 开场：洗 8 个扇区取 5 个，一上台就是均匀分布
    const opening = freeSectors().sort(() => Math.random() - 0.5).slice(0, MAX_ACTIVE);
    items.forEach((it, idx) => {
      const s = opening[idx];
      it.sector = s;
      sectorOwner[s] = it;                  // 占坑要登记，不然补位会撞进同一扇区
      it.ring = s % 4;
      const dur = place(it, it.text);
      it.el.style.animationDelay =
        `${(-Math.random() * dur).toFixed(2)}s, ${(-Math.random() * dur).toFixed(2)}s`;
    });

    // 一趟漂完：先退场（扇区放回池子），歇一小会儿再抢一个新扇区接着漂 ——
    // 补位有延迟，同屏数量才有呼吸感
    items.forEach((it) => {
      it.el.addEventListener('animationiteration', (e) => {
        if (e.animationName !== 'rwDrift') return; // 横摆那一层也在循环，别理它
        if (it.sector != null) { sectorOwner[it.sector] = null; it.sector = null; }
        setTimeout(() => {
          const s = claimSector();
          if (s == null) { setTimeout(() => it.el.dispatchEvent(new Event('rwRetry')), 1500); return; }
          it.sector = s;
          sectorOwner[s] = it;
          it.ring = s % 4;
          it.text = nextText();
          const dur = place(it, it.text);
          it.el.style.animationDelay = `0s, ${(-Math.random() * dur / 2).toFixed(2)}s`;
        }, 600 + Math.random() * 2000);
      });
    });
    // 没抢到扇区的：广播一个重试事件
    window.addEventListener('rwRetry', () => {
      items.forEach((it) => { if (it.sector == null) it.el.dispatchEvent(new Event('animationiteration')); });
    });

    // 窗口变了：圈跟着 vmin 缩放，全场重新落位（句子不换、扇区不动）
    let rs = null;
    window.addEventListener('resize', () => {
      clearTimeout(rs);
      rs = setTimeout(() => items.forEach((it) => { if (it.sector != null) place(it, it.text); }), 200);
    });
  })();

  const form = document.getElementById('form');
  const tokenEl = document.getElementById('token');
  const eye = document.getElementById('eye');
  const err = document.getElementById('err');
  const errText = document.getElementById('errText');
  const submit = document.getElementById('submit');

  // 显示 / 隐藏
  eye.addEventListener('click', () => {
    const hidden = tokenEl.type === 'password';
    tokenEl.type = hidden ? 'text' : 'password';
    eye.textContent = hidden ? '◌' : '◉';
    eye.setAttribute('aria-label', hidden ? '隐藏令牌' : '显示令牌');
    tokenEl.focus();
  });

  function showError(msg) {
    errText.textContent = msg;
    err.classList.remove('show');
    void err.offsetWidth; // 重启动画
    err.classList.add('show');
    tokenEl.focus();
    tokenEl.select();
  }

  // 提交
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const value = tokenEl.value.trim();

    if (!value) {
      showError('令牌不能为空');
      return;
    }

    submit.disabled = true;
    submit.textContent = '正在验证…';

    // 真的校验：POST /api/login { token } → 200 才放行
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ token: value }),
      });
      if (!r.ok) {
        const why = await r.json().catch(() => ({}));
        showError(why.error || '令牌不对');
        submit.disabled = false;
        submit.textContent = '进入';
        return;
      }
    } catch {
      showError('连不上面板服务，确认服务还在跑');
      submit.disabled = false;
      submit.textContent = '进入';
      return;
    }

    submit.textContent = '进来了';
    // 主页就是记忆海，登录完回根路径（/ 登录态下直接出海）
    window.location.href = '/';
  });

  // 回车直接提交；有输入就把错误收起来
  tokenEl.addEventListener('input', () => err.classList.remove('show'));
  tokenEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') form.requestSubmit();
  });
</script>
